name: build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # push the release tag and create the GitHub Release after a successful deploy

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    # arm64 runner: same CPU type as the server, free for public repos
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Build image
        run: docker build -t owl-backend:${{ github.sha }} .

      - name: Deploy (blue-green, zero downtime)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server only accepts "backend <commit>" from this key; the image arrives on stdin.
          docker save owl-backend:${{ github.sha }} | gzip -1 \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes deploy@"$DEPLOY_HOST" "backend ${{ github.sha }}"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # After a successful deploy: tag vX.Y.Z (version from build.gradle.kts) and publish a GitHub Release
      # with that version's CHANGELOG section. Skipped when the tag already exists (no version bump).
      - name: Tag release
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ "$V" = "v" ]; then echo "no version in build.gradle.kts"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "$V already tagged, nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "OwL backend $V"
          git push origin "$V"
          awk -v h="## ${V#v} " 'index($0, h) == 1 {f = 1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          gh release create "$V" --title "OwL backend $V" --notes-file notes.md --verify-tag
